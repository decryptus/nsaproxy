name: Validate and publish NSAProxy
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: nsaproxy-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools<81' wheel PyYAML build twine
      - run: python -m build --no-isolation
      - run: python -m twine check --strict dist/*
      - name: Test both installed distributions
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest "$GITHUB_WORKSPACE/tests"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          python -m pip install --no-build-isolation --force-reinstall --no-deps "$GITHUB_WORKSPACE"/dist/*.tar.gz
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          python -m pip check
          python -c 'from importlib.metadata import version; from pathlib import Path; import os; assert version("nsaproxy") == Path(os.environ["GITHUB_WORKSPACE"], "VERSION").read_text().strip()'
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish a new immutable source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$(cat RELEASE)"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'Existing release retained.'
            exit 0
          fi
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "NSAProxy $version" --notes-file "docs/release-$version.md"
  pypi:
    needs: [build, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
