name: Configuration contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools<81' wheel PyYAML
      - run: python -m pip install --no-build-isolation .
      - name: Verify collection and test the installed package
        run: |
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest "$GITHUB_WORKSPACE/tests"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
